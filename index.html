<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Hygiene Assessment Portal</title>
    <style>
        /* Modern Matrix Tech Theme CSS Styling */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        
        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: radial-gradient(circle at 10% 20%, rgba(0, 40, 100, 1) 0%, rgba(5, 12, 28, 1) 90%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Glowing Animated Dynamic Background Blobs */
        body::before, body::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(113, 137, 255, 0.15);
            filter: blur(80px);
            z-index: -1;
            animation: pulse 8s infinite alternate;
        }
        body::before { top: 10%; left: 15%; }
        body::after { bottom: 10%; right: 15%; background: rgba(110, 231, 161, 0.1); animation-delay: 4s; }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(20px, 20px); }
        }

        .app {
            width: 100%;
            max-width: 580px;
            padding: 10px;
            transition: max-width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 10;
        }
        
        .app.wide-mode { max-width: 95% !important; }

        /* Premium Glassmorphism Card Design */
        .card {
            background: rgba(13, 22, 47, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 35px;
            margin-top: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .hidden { display: none !important; }

        h1 {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #7189ff, #6ee7a1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #ffffff;
            border-left: 4px solid #5f78ff;
            padding-left: 12px;
        }

        h3 { font-size: 18px; font-weight: 600; margin-bottom: 12px; color: #f1f5f9; }
        p { color: #94a3b8; line-height: 1.6; font-size: 15px; }
        .center { text-align: center; }
        
        .logo {
            font-size: 65px;
            text-align: center;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(95, 120, 255, 0.4));
        }

        .subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; font-size: 16px; }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 50px;
            background: rgba(95, 120, 255, 0.15);
            border: 1px solid rgba(95, 120, 255, 0.3);
            color: #9fb2ff;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        label.field-label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
            letter-spacing: 0.5px;
        }

        /* Futuristic Inputs with Glow */
        input[type="text"], input[type="password"], input[type="tel"] {
            width: 100%;
            padding: 14px 18px;
            background: rgba(8, 14, 36, 0.6);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #7189ff;
            outline: none;
            box-shadow: 0 0 15px rgba(113, 137, 255, 0.25);
            background: rgba(8, 14, 36, 0.9);
        }

        /* High-Tech Glowing Buttons */
        button {
            width: 100%;
            padding: 15px 20px;
            margin-top: 15px;
            border: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, #5f78ff, #475eff);
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(95, 120, 255, 0.3);
            transition: all 0.25s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #7189ff, #5f78ff);
            box-shadow: 0 6px 20px rgba(95, 120, 255, 0.45);
            transform: translateY(-2px);
        }

        button:active { transform: translateY(0); }

        button.secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            box-shadow: none;
        }
        button.secondary:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.2); }

        button.danger { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
        button.danger:hover { background: linear-gradient(135deg, #f87171, #ef4444); }

        .role-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .role-buttons button { margin-top: 0; padding: 18px; font-size: 17px; }

        .result-box {
            border-radius: 14px;
            padding: 16px;
            margin-top: 15px;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.6;
            border: 1px solid transparent;
        }
        .result-box.success { background: rgba(110, 231, 161, 0.1); border-color: rgba(110, 231, 161, 0.2); color: #6ee7a1; }
        .result-box.warning { background: rgba(253, 209, 102, 0.1); border-color: rgba(253, 209, 102, 0.2); color: #ffd166; }
        .result-box.error { background: rgba(255, 116, 116, 0.1); border-color: rgba(255, 116, 116, 0.2); color: #ff7474; }
        .result-box.info { background: rgba(113, 137, 255, 0.1); border-color: rgba(113, 137, 255, 0.2); color: #9fb2ff; }

        /* Tech Progress Bar */
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #progressBar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #5f78ff, #6ee7a1);
            border-radius: 20px;
            transition: width 0.4s ease;
        }

        /* Beautiful Dynamic Questions Style */
        .question {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: left;
        }

        .question h3 { font-size: 16px; line-height: 1.5; color: #f8fafc; margin-bottom: 15px; }

        .option {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 14px 16px;
            margin-top: 10px;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option:hover {
            background: rgba(95, 120, 255, 0.08);
            border-color: rgba(95, 120, 255, 0.25);
            color: #ffffff;
            transform: translateX(3px);
        }

        .option input[type="radio"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            accent-color: #6ee7a1;
            cursor: pointer;
        }

        .score {
            text-align: center;
            font-size: 64px;
            font-weight: 800;
            background: linear-gradient(135deg, #7189ff, #6ee7a1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 20px 0;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 15px;
        }
        .top-bar h2 { border-left: none; padding-left: 0; margin-bottom: 0; }
        .top-bar button { width: auto; margin: 0; padding: 10px 18px; font-size: 14px; }

        /* Premium Data Table Design */
        .dashboard { width: 100%; overflow-x: auto; margin-top: 20px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); }
        table { width: 100%; min-width: 700px; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px 16px; font-size: 14px; }
        th { background: rgba(255, 255, 255, 0.04); color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid rgba(255,255,255,0.1); }
