<!DOCTYPE html>
<html>
<head>
    <title>Button Test</title>

    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }

        button {
            padding: 20px 40px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Button Test</h1>

    <button onclick="testButton()">
        CLICK ME
    </button>

    <h2 id="result"></h2>

    <script>
        function testButton() {
            document.getElementById("result").textContent =
                "✅ BUTTON IS WORKING!";
        }
    </script>

</body>
</html>
